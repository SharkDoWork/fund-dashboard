<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="900" height="400" fill="#ffffff"/><text x="24" y="34" font-size="19" font-weight="700" fill="#1f2937">段末偏差：把每段最后几天砍掉，结论就反转</text><text x="24" y="56" font-size="12.5" fill="#6b7280">底部段定义为「净值≤0.85」，涨破即结束 → 每段末尾天然自带上涨，系统性惩罚先卖后买</text><line x1="70" y1="141.7" x2="720" y2="141.7" stroke="#6b7280" stroke-width="1.4"/><text x="724" y="145.7" font-size="11" fill="#6b7280">0</text><rect x="90.0" y="141.7" width="110" height="145.9" fill="#059669" rx="3" opacity="0.88"/><text x="145.0" y="304.6" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">-36,857</text><text x="145.0" y="334" font-size="12" fill="#1f2937" text-anchor="middle">原始整段</text><text x="145.0" y="351" font-size="10.5" fill="#6b7280" text-anchor="middle">47次卖出</text><rect x="278.0" y="141.7" width="110" height="9.8" fill="#059669" rx="3" opacity="0.88"/><text x="333.0" y="168.4" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">-2,469</text><text x="333.0" y="334" font-size="12" fill="#1f2937" text-anchor="middle">砍掉末5日</text><text x="333.0" y="351" font-size="10.5" fill="#6b7280" text-anchor="middle">37次卖出</text><rect x="466.0" y="131.8" width="110" height="9.9" fill="#dc2626" rx="3" opacity="0.88"/><text x="521.0" y="122.8" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">+2,505</text><text x="521.0" y="334" font-size="12" fill="#1f2937" text-anchor="middle">砍掉末10日</text><text x="521.0" y="351" font-size="10.5" fill="#6b7280" text-anchor="middle">32次卖出</text><rect x="654.0" y="125.6" width="110" height="16.1" fill="#dc2626" rx="3" opacity="0.88"/><text x="709.0" y="116.6" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">+4,062</text><text x="709.0" y="334" font-size="12" fill="#1f2937" text-anchor="middle">砍掉末20日</text><text x="709.0" y="351" font-size="10.5" fill="#6b7280" text-anchor="middle">18次卖出</text><text x="24" y="378" font-size="12" fill="#d97706">结论：原始整段 −36,857 元这个数字是偏差产物，不可用。无偏检验必须用固定长度滚动窗口。</text></svg>